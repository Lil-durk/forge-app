modules:
  jiraServiceManagement:portalRequestCreatePropertyPanel:
    - key: ValidAIte-page
      resource: main
      resolver:
        function: resolver
      title: ValidAIte
  trigger:
    - key: issue-created-trigger
      function: issueCreatedHandler
      events:
        - avi:jira:created:issue
  webtrigger:
    - key: file-upload-trigger
      function: fileUploadTrigger
      response:
        type: dynamic
    - key: create-issue-trigger
      function: createIssueTrigger
      response:
        type: dynamic
    - key: pending-files-trigger
      function: pendingFilesTrigger
      response:
        type: dynamic
    - key: attach-file-trigger
      function: attachFileTrigger
      response:
        type: dynamic
    - key: create-issue-downloadable-trigger
      function: createDownloadTrigger
      response:
        type: dynamic
    - key: create-issue-analysis-trigger
      function: createAnalysisTrigger
      response:
        type: dynamic
  function:
    - key: resolver
      handler: index.handler
    - key: issueCreatedHandler
      handler: index.issueCreatedHandler
    - key: fileUploadTrigger
      handler: index.fileUploadTrigger
    - key: createIssueTrigger
      handler: index.createIssueTrigger
    - key: pendingFilesTrigger
      handler: index.pendingFilesTrigger
    - key: attachFileTrigger
      handler: index.attachFileTrigger
    - key: createDownloadTrigger
      handler: index.createIssueWithDownloadableFilesTrigger
    - key: downloadFileHandler
      handler: index.downloadFileHandler
    - key: createAnalysisTrigger
      handler: index.createIssueWithAnalysisReportTrigger

resources:
  - key: main
    path: static/validaite/build
    tunnel:
      port: 3000

app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/2e35b1f5-76b4-4783-ab49-67a609c07e61

permissions:
  content:
    styles:
      - unsafe-inline
  scopes:
    - storage:app
    - read:jira-work
    - read:attachment:jira
    - write:jira-work
    - write:attachment:jira
  external:
    fetch:
      backend:
        - address: "*.atlassian.net"
        - address: https://api-v2.bonzai.iodigital.com
        - address: https://api-v2.bonzai.iodigital.com/*
        - address: https://*.bonzai.iodigital.com
        - address: https://bonzai.iodigital.com
