modules:
  jiraServiceManagement:portalRequestCreatePropertyPanel:
    - key: ValidAIte-page
      resource: main
      resolver:
        function: resolver
      title: ValidAIte
  function:
    - key: resolver
      handler: index.handler

resources:
  - key: main
    path: static/validaite/build
    tunnel:
      port: 3000

app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/2e35b1f5-76b4-4783-ab49-67a609c07e61

permissions:
  content:
    styles:
      - unsafe-inline
  scopes:
    - storage:app
    - read:jira-work
    - read:attachment:jira
  external:
    fetch:
      backend:
        - address: "*.atlassian.net"
        - address: https://api-v2.bonzai.iodigital.com
        - address: https://api-v2.bonzai.iodigital.com/*
        - address: https://*.bonzai.iodigital.com
        - address: https://bonzai.iodigital.com
